# /config/packages/multi_rfid_reminder.yaml
# Robust multi-reminder RFID system with per-reminder tracking and Find My style phone alerts

##############################################################
# INPUT NUMBER (Global settings)
##############################################################
input_number:
  global_reminder_volume:
    name: Default Alert Volume
    min: 0.1
    max: 1.0
    step: 0.1
    unit_of_measurement: "%"
    icon: mdi:volume-high
    mode: slider
    initial: 0.7

##############################################################
# INPUT TEXT (For storing reminder configurations as JSON)
##############################################################
input_text:
  reminder_configs:
    name: Reminder Configurations
    icon: mdi:database
    max: 10000
    initial: "[]"

##############################################################
# SCRIPT - Add New Reminder
##############################################################
script:
  add_rfid_reminder:
    alias: "Add RFID Reminder"
    fields:
      reminder_name:
        description: "Name of the reminder"
        example: "Medication"
        required: true
        selector:
          text: {}
      rfid_tag:
        description: "RFID tag ID"
        example: "1234567890"
        required: true
        selector:
          text: {}
      interval_hours:
        description: "Hours between reminders (0.5 - 24)"
        example: 4
        required: true
        selector:
          number:
            min: 0.5
            max: 24
            step: 0.5
            mode: slider
      volume:
        description: "Alert volume (0.1 - 1.0)"
        example: 0.7
        required: false
        default: 0.7
        selector:
          number:
            min: 0.1
            max: 1.0
            step: 0.1
            mode: slider
      media_players:
        description: "List of media_player entity IDs (JSON array)"
        example: '["media_player.living_room", "media_player.kitchen"]'
        required: false
        default: "[]"
        selector:
          text:
            multiline: false
      notification_targets:
        description: "List of mobile_app device IDs or notify targets (JSON array)"
        example: '["device_tracker.phone1", "device_tracker.phone2"]'
        required: false
        default: "[]"
        selector:
          text:
            multiline: false
      custom_message:
        description: "Custom reminder message"
        example: "Time for your medication!"
        required: true
        selector:
          text: {}
    sequence:
      - variables:
          configs: "{{ states('input_text.reminder_configs') | from_json([]) }}"
          media_list: "{{ media_players | from_json([]) }}"
          notify_list: "{{ notification_targets | from_json([]) }}"
          new_config:
            name: "{{ reminder_name }}"
            rfid_tag: "{{ rfid_tag }}"
            interval: "{{ interval_hours | float }}"
            volume: "{{ volume | float(0.7) }}"
            media_players: "{{ media_list }}"
            notification_targets: "{{ notify_list }}"
            message: "{{ custom_message }}"
            enabled: true
            active: false
            last_triggered: null
            snooze_until: null
          updated: "{{ configs + [new_config] }}"
      - service: input_text.set_value
        target:
          entity_id: input_text.reminder_configs
        data:
          value: "{{ updated | to_json }}"
      - service: notify.notify
        data:
          message: "Reminder '{{ reminder_name }}' added successfully!"
          title: "RFID Reminder System"

##############################################################
# AUTOMATIONS
##############################################################
automation:

  # ------------------------------------------------------------
  # Initialization
  # ------------------------------------------------------------
  - id: "multi_rfid_reminder_init"
    alias: "Multi RFID Reminder - Initialize"
    description: "Starts monitor on HA startup"
    trigger:
      - platform: homeassistant
        event: start
    action:
      - service: automation.turn_on
        target:
          entity_id: automation.multi_rfid_reminder_monitor
      - service: automation.trigger
        target:
          entity_id: automation.multi_rfid_reminder_monitor

  # ------------------------------------------------------------
  # Main Monitor – checks per-reminder intervals and snoozes
  # ------------------------------------------------------------
  - id: "multi_rfid_reminder_monitor"
    alias: "Multi RFID Reminder - Monitor"
    description: "Evaluates each reminder and triggers when needed"
    mode: parallel
    max_exceeded: silent
    trigger:
      - platform: time_pattern
        minutes: "/1"  # Check every minute
    action:
      - variables:
          configs: "{{ states('input_text.reminder_configs') | from_json([]) }}"
      - repeat:
          for_each: "{{ configs }}"
          sequence:
            - variables:
                reminder: "{{ repeat.item }}"
                now_ts: "{{ now().timestamp() }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ reminder.enabled and not reminder.active }}"
                  sequence:
                    - variables:
                        last_ts: "{{ reminder.last_triggered | default(0) }}"
                        snooze_until: "{{ reminder.snooze_until | default(0) }}"
                        interval_seconds: "{{ (reminder.interval * 3600) | int }}"
                    - condition: template
                      value_template: >
                        {% if snooze_until > now_ts %}false
                        {% elif last_ts == 0 %}true
                        {% elif (now_ts - last_ts) > interval_seconds %}true
                        {% else %}false
                        {% endif %}
                    - service: automation.trigger
                      data:
                        skip_condition: true
                      target:
                        entity_id: automation.multi_rfid_reminder_trigger
                      data:
                        reminder_name: "{{ reminder.name }}"

  # ------------------------------------------------------------
  # Trigger – activates a specific reminder and updates its last_triggered
  # ------------------------------------------------------------
  - id: "multi_rfid_reminder_trigger"
    alias: "Multi RFID Reminder - Trigger"
    description: "Marks reminder as active and updates its last triggered time"
    mode: single
    max_exceeded: silent
    trigger:
      - platform: event
        event_type: automation_triggered
        event_data:
          entity_id: automation.multi_rfid_reminder_trigger
    action:
      - variables:
          reminder_name: "{{ trigger.event.data.reminder_name }}"
          configs: "{{ states('input_text.reminder_configs') | from_json([]) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ reminder_name is defined }}"
            sequence:
              - variables:
                  updated_configs: >
                    {% set ns = namespace(new=[]) %}
                    {% for r in configs %}
                      {% if r.name == reminder_name %}
                        {% set r = dict(r, active=true, last_triggered=now().timestamp()) %}
                      {% endif %}
                      {% set ns.new = ns.new + [r] %}
                    {% endfor %}
                    {{ ns.new }}
              - service: input_text.set_value
                target:
                  entity_id: input_text.reminder_configs
                data:
                  value: "{{ updated_configs | to_json }}"
              - service: automation.trigger
                target:
                  entity_id: automation.multi_rfid_reminder_alert
                data:
                  reminder_name: "{{ reminder_name }}"

  # ------------------------------------------------------------
  # Alert – loops media and phone notifications until cleared
  # ------------------------------------------------------------
  - id: "multi_rfid_reminder_alert"
    alias: "Multi RFID Reminder - Alert"
    description: "Plays alerts for a specific reminder until cleared"
    mode: parallel
    max_exceeded: silent
    trigger:
      - platform: event
        event_type: automation_triggered
        event_data:
          entity_id: automation.multi_rfid_reminder_alert
    action:
      - variables:
          reminder_name: "{{ trigger.event.data.reminder_name }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ reminder_name is defined }}"
            sequence:
              - parallel:
                  - alias: "Media Player Alert Loop"
                    sequence:
                      - repeat:
                          while:
                            - condition: template
                              value_template: >
                                {% set current = (states('input_text.reminder_configs') | from_json([]))
                                   | selectattr('name', 'equalto', reminder_name) | first %}
                                {{ current is defined and current.active }}
                          sequence:
                            - variables:
                                current: "{{ (states('input_text.reminder_configs') | from_json([]))
                                           | selectattr('name', 'equalto', reminder_name) | first }}"
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: "{{ current.media_players | default([]) | length > 0 }}"
                                  sequence:
                                    - repeat:
                                        for_each: "{{ current.media_players }}"
                                        sequence:
                                          - service: media_player.volume_set
                                            data:
                                              volume_level: "{{ current.volume | float(0.7) }}"
                                            target:
                                              entity_id: "{{ repeat.item }}"
                                          - service: media_player.play_media
                                            data:
                                              media_content_id: "/media/local/alert.mp3"
                                              media_content_type: "music"
                                              enqueue: "play"
                                            target:
                                              entity_id: "{{ repeat.item }}"
                            - delay:
                                seconds: 10

                  - alias: "Phone Alert Loop (Find My Style)"
                    sequence:
                      - repeat:
                          while:
                            - condition: template
                              value_template: >
                                {% set current = (states('input_text.reminder_configs') | from_json([]))
                                   | selectattr('name', 'equalto', reminder_name) | first %}
                                {{ current is defined and current.active }}
                          sequence:
                            - variables:
                                current: "{{ (states('input_text.reminder_configs') | from_json([]))
                                           | selectattr('name', 'equalto', reminder_name) | first }}"
                            - choose:
                                - conditions:
                                    - condition: template
                                      value_template: "{{ current.notification_targets | default([]) | length > 0 }}"
                                  sequence:
                                    - repeat:
                                        for_each: "{{ current.notification_targets }}"
                                        sequence:
                                          - service: notify.mobile_app
                                            data:
                                              title: "🔔 {{ current.name }}"
                                              message: >
                                                {{ current.message }}
                                                
                                                ⏰ Time: {{ now().strftime('%I:%M %p') }}
                                                
                                                Scan your RFID tag to stop this reminder.
                                              target: "{{ repeat.item }}"
                                              data:
                                                push:
                                                  sound:
                                                    name: "default"
                                                    critical: 1
                                                    volume: "{{ (current.volume | float(0.7) * 100) | int }}"
                                                  priority: "high"
                                                  ttl: 0
                                                  tag: "rfid_{{ current.name | slugify }}"
                                                  channel: "alarm_stream"
                                                  importance: "high"
                                                  visibility: "public"
                                                  ledColor: "red"
                                                  vibrationPattern: [1000, 1000, 1000]
                                                  actions:
                                                    - action: "SNOOZE"
                                                      title: "Snooze 10min"
                                                    - action: "CLEAR"
                                                      title: "Clear Manually"
                                    - delay:
                                        seconds: 30

  # ------------------------------------------------------------
  # RFID Scanner – clears reminders when matching tag scanned
  # ------------------------------------------------------------
  - id: "multi_rfid_reminder_scanner"
    alias: "Multi RFID Reminder - Scanner"
    description: "Deactivates reminders when RFID tag is scanned"
    trigger:
      - platform: event
        event_type: tag_scanned
      - platform: mqtt
        topic: "rfid/scanner/tag"
    action:
      - variables:
          tag_id: "{{ trigger.event.data.tag_id if trigger.event and trigger.event.data else trigger.payload }}"
          configs: "{{ states('input_text.reminder_configs') | from_json([]) }}"
          active_matches: >
            {% set matches = [] %}
            {% for r in configs %}
              {% if r.rfid_tag == tag_id and r.active %}
                {% set matches = matches + [r] %}
              {% endif %}
            {% endfor %}
            {{ matches }}
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ active_matches | length > 0 }}"
            sequence:
              - variables:
                  cleared_names: "{{ active_matches | map(attribute='name') | list }}"
                  updated_configs: >
                    {% set ns = namespace(new=[]) %}
                    {% for r in configs %}
                      {% if r.rfid_tag == tag_id %}
                        {% set r = dict(r, active=false, snooze_until=null) %}
                      {% endif %}
                      {% set ns.new = ns.new + [r] %}
                    {% endfor %}
                    {{ ns.new }}
              - service: input_text.set_value
                target:
                  entity_id: input_text.reminder_configs
                data:
                  value: "{{ updated_configs | to_json }}"
              - service: notify.notify
                data:
                  title: "✅ Reminder Cleared"
                  message: "Cleared: {{ cleared_names | join(', ') }}\nTag: {{ tag_id }}"
              - service: media_player.media_stop
                target:
                  entity_id: all

  # ------------------------------------------------------------
  # Snooze – handles snooze action from notification
  # ------------------------------------------------------------
  - id: "multi_rfid_reminder_snooze"
    alias: "Multi RFID Reminder - Snooze"
    description: "Snoozes a specific reminder for 10 minutes"
    trigger:
      - platform: event
        event_type: mobile_app_notification_action
    condition:
      - condition: template
        value_template: "{{ trigger.event.data.action == 'SNOOZE' }}"
    action:
      - variables:
          message: "{{ trigger.event.data.message }}"
          reminder_name: "{{ message.split('\n')[0] | replace('🔔 ', '') | trim }}"
          configs: "{{ states('input_text.reminder_configs') | from_json([]) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ reminder_name is defined }}"
            sequence:
              - variables:
                  snooze_until: "{{ (now().timestamp() + 600) | int }}"  # 10 minutes
                  updated_configs: >
                    {% set ns = namespace(new=[]) %}
                    {% for r in configs %}
                      {% if r.name == reminder_name %}
                        {% set r = dict(r, active=false, snooze_until=snooze_until) %}
                      {% endif %}
                      {% set ns.new = ns.new + [r] %}
                    {% endfor %}
                    {{ ns.new }}
              - service: input_text.set_value
                target:
                  entity_id: input_text.reminder_configs
                data:
                  value: "{{ updated_configs | to_json }}"
              - service: media_player.media_stop
                target:
                  entity_id: all
              - service: notify.notify
                data:
                  title: "⏸️ Reminder Snoozed"
                  message: "{{ reminder_name }} snoozed for 10 minutes."

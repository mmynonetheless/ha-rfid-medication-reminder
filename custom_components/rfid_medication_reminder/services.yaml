add_reminder:
  name: Add Reminder
  description: Add a new medication reminder
  fields:
    reminder_name:
      name: Reminder Name
      description: Unique name for the reminder
      required: true
      selector:
        text:
    rfid_tag:
      name: RFID Tag
      description: The RFID tag ID that clears this reminder
      required: true
      selector:
        text:
    interval_hours:
      name: Interval Hours
      description: Hours between triggers (0.5 to 24)
      required: true
      selector:
        number:
          min: 0.5
          max: 24
          step: 0.5
          mode: slider
    volume:
      name: Volume
      description: Alert volume (0.1 to 1.0)
      required: false
      default: 0.7
      selector:
        number:
          min: 0.1
          max: 1.0
          step: 0.1
          mode: slider
    media_players:
      name: Media Players
      description: List of media_player entity IDs
      required: false
      example: '["media_player.living_room"]'
      selector:
        object:
    notification_targets:
      name: Notification Targets
      description: List of mobile_app device IDs
      required: false
      example: '["device_tracker.my_phone"]'
      selector:
        object:
    custom_message:
      name: Custom Message
      description: Message shown in notifications
      required: true
      selector:
        text:
          multiline: true

add_condition:
  name: Add Condition
  description: Add a condition to an existing reminder
  fields:
    reminder_name:
      name: Reminder Name
      description: Name of the reminder to add condition to
      required: true
      selector:
        text:
    condition_type:
      name: Condition Type
      description: How multiple conditions should be evaluated
      required: false
      default: "all"
      selector:
        select:
          options:
            - "all"
            - "any"
            - "none"
    time_start:
      name: Time Start
      description: Start time for time window (HH:MM format)
      required: false
      example: "08:00"
      selector:
        time:
    time_end:
      name: Time End
      description: End time for time window (HH:MM format)
      required: false
      example: "20:00"
      selector:
        time:
    weekdays:
      name: Weekdays
      description: Days of the week when reminder can trigger
      required: false
      selector:
        select:
          options:
            - "monday"
            - "tuesday"
            - "wednesday"
            - "thursday"
            - "friday"
            - "saturday"
            - "sunday"
          multiple: true
    days_of_month:
      name: Days of Month
      description: Days of month when reminder can trigger (1-31)
      required: false
      selector:
        object:
    months:
      name: Months
      description: Months when reminder can trigger (1-12)
      required: false
      selector:
        object:
    entity_conditions:
      name: Entity Conditions
      description: List of entity state conditions
      required: false
      selector:
        object:

remove_condition:
  name: Remove Condition
  description: Remove a condition from a reminder
  fields:
    reminder_name:
      name: Reminder Name
      description: Name of the reminder
      required: true
      selector:
        text:
    condition_index:
      name: Condition Index
      description: Index of condition to remove (0-based)
      required: true
      selector:
        number:
          min: 0
          max: 20
          step: 1
          mode: box

clear_reminder:
  name: Clear Reminder
  description: Clear a reminder by RFID tag
  fields:
    rfid_tag:
      name: RFID Tag
      description: The RFID tag that was scanned
      required: true
      selector:
        text:
